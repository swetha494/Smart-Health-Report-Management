<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="create-acnt.css">

</head>

<body>

<div class="register-container">

    <h2 class="top-title">Create Account</h2>

    <div class="register-box">

        <h1>Set up your health profile</h1>

        <p class="subtitle">
            Create a secure account to start storing reports and emergency details.
        </p>

        <form>

            <label>Full name</label>

            <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Enter patient name">
            </div>

            <label>Email</label>

            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="patient@example.com">
            </div>

            <label>Phone</label>

            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="text" placeholder="+91 98765 43210">
            </div>

            <label>Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Create password">
            </div>

            <label>Confirm password</label>

            <div class="input-box">
                <i class="fa-solid fa-key"></i>
                <input type="password" placeholder="Re-enter password">
            </div>

            <button class="register-btn">
                <i class="fa-solid fa-user-plus"></i>
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="#">Login</a>
        </div>

    </div>

</div>

</body>
</html>
